<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Reto AR</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets timeout="30000">
            <a-asset-item id="avatar" src="./avatar.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 1 0"></a-entity>

        <a-plane rotation="-90 0 0" width="4" height="4" color="#999"></a-plane>

        <a-entity id="dino" position="1 1 1" scale="1 1 1">
            <a-entity gltf-model="#avatar" rotation="0 0 0" position="0 2.15 0" animation-mixer></a-entity>
        </a-entity>
        <a-entity camera look-controls position="0 1.6 3"></a-entity>
        <a-camera gps-camera rotation-reader> </a-camera>
    </a-scene>
</body>

</html>
